[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-verification"
version = "0.1.0"
description = "Black-box verification harness for the verified scheduler"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "hypothesis==6.140.2",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
